server {
    listen 80;
    server_name example.ru;

    client_max_body_size 160m;  # 3MF files of cards: MAX_MODEL_MB in .env
    gzip on;
    gzip_types text/html application/javascript text/css application/json application/wasm application/octet-stream;

    # neural network files: served by nginx directly, cached by browsers for 30 days
    location /ai/ {
        alias /opt/kartochki/static/ai/;
        types { application/wasm wasm; application/octet-stream onnx; }
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
