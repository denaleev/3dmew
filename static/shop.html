.fpanel .fg{display:flex;flex-direction:column;gap:6px}.fpanel .fg>span{font-size:12.5px;font-weight:800;color:#5e4a5c}
.fpanel input[type=number]{width:96px;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px}
.fpanel select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background-color:#fff}
.sws{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;background-size:cover;background-position:center}
.sw.on{box-shadow:0 0 0 2.5px var(--acc)}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.pk{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:5px 11px 5px 5px;cursor:pointer;background:#fff;font:inherit;font-size:13.5px;font-weight:700;color:var(--text)}
.pk i{width:30px;height:30px;border-radius:50%;flex:none;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pk.on{border-color:var(--acc);background:var(--soft)}
.pkmore{border:1.5px dashed var(--line);border-radius:14px;padding:9px 34px 9px 12px;font:inherit;font-size:13.5px;font-weight:700;color:var(--acc);background-color:#fff;cursor:pointer;max-width:100%}
.pkmore.on{border:1.5px solid var(--acc);background-color:var(--soft)}
.cphoto .csw{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);background-size:cover}
.cphoto{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:8px;margin:-4px 0 12px;font-size:13.5px}
.cphoto img{width:74px;height:74px;object-fit:cover;border-radius:10px;flex:none}
.gal{display:flex;flex-direction:column;gap:10px}
.gal .main{position:relative;border-radius:16px;overflow:hidden;background:#f8efe6}
.gal .main img,.gal .main video{width:100%;display:block;max-height:78vh;object-fit:contain;background:#f8efe6}
.gal .ths{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.gal .ths button{flex:none;width:66px;height:66px;border-radius:11px;border:2px solid transparent;padding:0;overflow:hidden;cursor:pointer;background:#f8efe6;position:relative;font-size:22px}
.gal .ths button.on{border-color:var(--acc)}.gal .ths img{width:100%;height:100%;object-fit:cover;display:block}
.gal .ths .vid::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.adm{display:flex;gap:8px;flex-wrap:wrap;background:#fff4e6;border:1.5px dashed #f3b37a;border-radius:14px;padding:8px 10px;margin:0 44px 12px 0;align-items:center;font-size:13px}
.adm b{color:#b45309;margin-right:4px}
.tag.hid{left:auto;right:10px;background:#2d1a33;color:#fff}
.pc.hidden .im img{opacity:.45}
.ed .mrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ed .mi{width:96px;position:relative;font-size:11px;text-align:center}
.ed .mi .th{width:96px;height:96px;border-radius:12px;overflow:hidden;background:#f8efe6;display:grid;place-items:center;font-size:30px;margin-bottom:3px}
.ed .mi .th img{width:100%;height:100%;object-fit:cover}
.ed .mi .acts{display:flex;justify-content:center;gap:2px}.ed .mi .acts button{border:0;background:#f7ece2;border-radius:8px;width:28px;height:26px;cursor:pointer;font-size:13px;padding:0}
.ed .cg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ed .cg label{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:12px;padding:5px 10px 5px 5px;cursor:pointer;font-size:13px;font-weight:700}
.ed .cg label:has(input:checked){border-color:var(--acc);background:var(--soft)}.ed .cg input{display:none}
.ed .cg i{width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pal .c{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pal .c .ph{aspect-ratio:1;background-size:cover;background-position:center;position:relative}
.pal .c .ph i{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.pal .c .b{padding:9px 12px}.pal .c b{display:block}.pal .c small{color:var(--muted)}
.about{max-width:820px;margin:0 auto}.about .txt p{line-height:1.7;margin:0 0 12px}.about .txt ul{padding-left:20px;line-height:1.7}
footer .ftext{flex-basis:100%;font-size:13px;line-height:1.55;max-width:900px}
</style>
</head>
<body>
<header><div class="hw">
  <a class="brand" href="#/" id="homeBtn" title="На главную"><img class="lg" src="/img/logo-160.png" alt=""><span id="shopName">3D-мастерская</span></a>
  <div class="sp"></div>
  <a class="btn sm ghost" href="#about">🐾 <span class="lbl">О проекте</span></a>
  <a class="btn sm ghost" href="#custom">💡 <span class="lbl">Своя идея</span></a>
  <a class="btn sm ghost" href="#fav" id="favLink">♡ <span class="lbl">Избранное</span><b id="favN" class="cnt"></b></a>
  <a class="btn sm ghost" href="#my">📦 <span class="lbl">Мои заказы</span></a>
  <a class="btn sm ghost hide" id="admLink" href="/admin">📋 <span class="lbl">Админка</span></a>
  <div class="am"><button class="btn sm" id="acct" aria-haspopup="true">👤 <span class="lbl">Войти</span></button><div class="amenu hide" id="acctMenu" role="menu"></div></div>
  <button class="btn sm pri cartb" id="cartBtn"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.1 10.2a1.6 1.6 0 0 0 1.6 1.3h8.3a1.6 1.6 0 0 0 1.5-1.2L20.5 8H6.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.6" fill="currentColor"/><circle cx="17" cy="19.5" r="1.6" fill="currentColor"/></svg> <span class="lbl">Корзина</span><b id="cartN"></b></button>
</div></header>

<main id="view"></main>

<footer id="foot"></footer>

<button class="fab" id="cartFab" aria-label="Корзина"><svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.1 10.2a1.6 1.6 0 0 0 1.6 1.3h8.3a1.6 1.6 0 0 0 1.5-1.2L20.5 8H6.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.6" fill="currentColor"/><circle cx="17" cy="19.5" r="1.6" fill="currentColor"/></svg><b id="cartN2"></b></button>
<div class="shade" id="shade"></div>
<aside class="drawer" id="cart" aria-label="Корзина">
  <div class="hd"><h3>🛒 Корзина</h3><button class="x" style="position:static" id="cartClose">✕</button></div>
  <div class="ls" id="cartList"></div>
  <div class="ft"><div class="tot"><span>Итого</span><span id="cartTot">0 ₽</span></div>
    <button class="btn pri big" style="width:100%" id="toCheckout">Оформить заказ</button></div>
</aside>

<div class="ov" id="pOv"><div class="modal" id="pBox"></div></div>

<div class="ov" id="authOv"><div class="modal sm">
  <button class="x" id="authX">✕</button>
  <h2 id="authT" style="margin:0 0 4px">Вход</h2>
  <div style="color:var(--muted);font-size:14px">Чтобы видеть все свои заказы и заявки в одном месте. Заказать можно и без входа.</div>
  <div class="mtabs"><button class="btn sm pri" data-am="in">Войти</button><button class="btn sm" data-am="up">Новый аккаунт</button></div>
  <div class="oa" id="oa"></div>
  <label class="f"><span>Имя или почта</span><input id="aName" autocomplete="username"></label>
  <label class="f"><span>Пароль (от 6 символов)</span><input id="aPass" type="password" autocomplete="current-password"></label>
  <div class="err" id="aErr"></div>
  <button class="btn pri" style="width:100%" id="aGo">Войти</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=x=>Math.round(+x||0).toLocaleString('ru-RU')+' ₽';
const fdate=s=>new Date(s).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
async function api(url,o){o=o||{};const opt={method:o.method||'GET',credentials:'same-origin',headers:{}};
  if(o.json!==undefined){opt.headers['content-type']='application/json';opt.body=JSON.stringify(o.json)}else if(o.form)opt.body=o.form;
  const r=await fetch(url,opt);
  if(!r.ok){let m='Ошибка '+r.status;try{const j=await r.json();if(j.detail)m=typeof j.detail==='string'?j.detail:(j.detail[0]&&j.detail[0].msg)||m}catch(e){}const er=new Error(m);er.status=r.status;throw er}
  return r.status===204?null:r.json()}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}

const S={info:null,user:null,products:[],cats:[],q:'',cat:'',sort:'popular',cart:ls.get('shop_cart',[]),files:[],f:{},fOpen:false,showHidden:true};

/* ---------- shop info, account ---------- */
async function boot(){
  try{S.info=await api('/api/shop/info')}catch(e){S.info={name:'3D-мастерская',delivery:[{id:'pickup',label:'Самовывоз'}]}}
  $('shopName').textContent=S.info.name;document.title=S.info.name;
  if(S.info.favicon_v)document.querySelectorAll('link[rel=icon],link[rel=apple-touch-icon]').forEach(l=>l.href=l.href.split('?')[0]+'?v='+S.info.favicon_v);
  const f=[];if(S.info.phone)f.push('📞 <a href="tel:'+esc(S.info.phone.replace(/[^\d+]/g,''))+'">'+esc(S.info.phone)+'</a>');
  if(S.info.email)f.push('✉️ <a href="mailto:'+esc(S.info.email)+'">'+esc(S.info.email)+'</a>');
  if(S.info.telegram)f.push('✈️ <a href="https://t.me/'+esc(S.info.telegram.replace(/^@|https?:\/\/t\.me\//g,''))+'" target="_blank" rel="noopener">'+esc(S.info.telegram)+'</a>');
  if(S.info.max)f.push('💬 MAX: '+(/^https?:\/\//.test(S.info.max)?'<a href="'+esc(S.info.max)+'" target="_blank" rel="noopener">написать</a>':esc(S.info.max)));
  if(S.info.address)f.push('📍 '+esc(S.info.address));
  $('foot').innerHTML='<b>'+esc(S.info.name)+'</b>'+f.map(x=>'<span>'+x+'</span>').join('')
    +(S.info.footer_text?'<div class="ftext">'+esc(S.info.footer_text)+'</div>':'')
    +'<div class="flinks"><a href="#about">О проекте</a><a href="#contact">Обратная связь</a><a href="#info/terms">Доставка, оплата и возврат</a><a href="#info/privacy">Политика конфиденциальности</a><a href="#info/consent">Согласие на обработку данных</a><a href="#info/seller">Реквизиты</a></div>'
    +'<div class="seller">'+(S.info.seller_name?'Продавец: '+esc(sellerLine()):'')+(S.info.seller_name?'. ':'')+'Информация на сайте не является публичной офертой (п. 2 ст. 437 ГК РФ).</div>';
  try{const u=await api('/api/me');if(u&&u.id)S.user=u}catch(e){}
  updAcct();updCart();updFav();syncFav();
  if(/[?&]login=/.test(location.search)){if(/login=fail/.test(location.search))toast('Не получилось войти через соцсеть');history.replaceState(null,'',location.pathname+location.hash)}
  route()}
function updAcct(){$('acct').innerHTML='👤 <span class="lbl">'+(S.user?esc(S.user.name):'Войти')+'</span>';$('admLink').classList.toggle('hide',!(S.user&&S.user.admin))}
function logout(){api('/api/auth/logout',{method:'POST'}).catch(()=>{});S.user=null;S.acct=null;updAcct();toast('Вы вышли из аккаунта');location.hash='#/';route()}
function acctMenu(open){const m=$('acctMenu');if(!open){m.classList.add('hide');return}
  const n=S.cart.reduce((a,l)=>a+l.qty,0);
  m.innerHTML=`<div class="hd"><b>${esc(S.user.name)}</b><small>${S.user.admin?'администратор':'личный кабинет'}</small></div>
    <a href="#account" role="menuitem">👤 Личный кабинет</a><a href="#my" role="menuitem">📦 Мои заказы и заявки</a>
    <a href="#fav" role="menuitem">♥ Избранное<span class="cnt2">${S.fav.length||''}</span></a><a href="#" data-cart role="menuitem">🛒 Корзина<span class="cnt2">${n||''}</span></a>
    <a href="#account/settings" role="menuitem">⚙️ Настройки и безопасность</a>${S.user.admin?'<a href="/admin" role="menuitem">📋 Управление магазином</a>':''}
    <button class="out" data-out role="menuitem">🚪 Выйти</button>`;m.classList.remove('hide')}
$('acct').onclick=e=>{e.stopPropagation();if(!S.user)return openAuth();acctMenu($('acctMenu').classList.contains('hide'))};
$('acctMenu').onclick=e=>{if(e.target.closest('[data-out]'))logout();else if(e.target.closest('[data-cart]')){e.preventDefault();openCart()}acctMenu(false)};
document.addEventListener('click',e=>{if(!e.target.closest('.am'))acctMenu(false)});
let am='in';
function setAm(m){am=m;document.querySelectorAll('[data-am]').forEach(b=>b.classList.toggle('pri',b.dataset.am===m));$('authT').textContent=m==='in'?'Вход':'Новый аккаунт';$('aGo').textContent=m==='in'?'Войти':'Создать аккаунт'}
document.querySelectorAll('[data-am]').forEach(b=>b.onclick=()=>setAm(b.dataset.am));
async function openAuth(){$('authOv').classList.add('on');$('aErr').textContent='';setAm(am);
  try{const r=await api('/api/auth/providers'),n={google:'Google',yandex:'Яндекс',mailru:'Mail.ru',vk:'VK'};
    $('oa').innerHTML=r.providers.map(p=>`<a class="btn sm" href="/api/auth/${p}/start?next=/">${n[p]||p}</a>`).join('')}catch(e){}}
$('authX').onclick=()=>$('authOv').classList.remove('on');
$('aPass').onkeydown=e=>{if(e.key==='Enter')$('aGo').click()};
$('aGo').onclick=async()=>{try{S.user=await api('/api/auth/'+(am==='up'?'register':'login'),{method:'POST',json:{login:$('aName').value,password:$('aPass').value}});
  $('authOv').classList.remove('on');updAcct();syncFav();syncCart();toast('Привет, '+S.user.name+'!');route()}catch(e){$('aErr').textContent=e.message}};

/* ---------- cart ---------- */
function saveCart(){ls.set('shop_cart',S.cart);updCart();updBuy();syncCart()}
// the admin sees carts that were not ordered yet (only products and quantities, no personal data)
function cartToken(){let t=ls.get('shop_cart_id','');if(!/^[A-Za-z0-9_-]{16,40}$/.test(t)){t=Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_'[b%64]).join('');ls.set('shop_cart_id',t)}return t}
function syncCart(){clearTimeout(S.cst);S.cst=setTimeout(()=>{api('/api/shop/cart',{method:'PUT',json:{token:cartToken(),items:S.cart.map(l=>({id:l.id,qty:l.qty,color:l.color||0})),favs:S.fav}}).catch(()=>{})},800)}
/* favourites: in the browser, and on the server for signed-in buyers (seen on every device) */
S.fav=ls.get('shop_fav',[]);
const isFav=id=>S.fav.includes(id);
function updFav(){ls.set('shop_fav',S.fav);if(S.fav.length||S.favSent)syncCart();S.favSent=S.fav.length>0||S.favSent;const n=$('favN');if(n)n.textContent=S.fav.length||'';const l=$('favLink');if(l)l.firstChild.textContent=S.fav.length?'♥ ':'♡ '}
async function toggleFav(id){const on=!isFav(id);S.fav=on?[id].concat(S.fav):S.fav.filter(x=>x!==id);updFav();toast(on?'Добавлено в избранное ♥':'Убрано из избранного');
  if(S.user)try{const r=on?await api('/api/shop/favorites',{method:'POST',json:{ids:[id]}}):await api('/api/shop/favorites/'+id,{method:'DELETE'});S.fav=r.ids;updFav()}catch(e){}}
async function syncFav(){if(!S.user)return;try{const r=await api('/api/shop/favorites',{method:'POST',json:{ids:S.fav}});S.fav=r.ids;updFav()}catch(e){}}
async function favPage(){const v=$('view');v.innerHTML=`<h2 style="margin:6px 0 14px">♥ Избранное</h2><div class="grid" id="grid"><div class="empty" style="grid-column:1/-1">Загружаю…</div></div>
    ${S.user?'':'<p class="fine" style="margin-top:14px">Избранное хранится в этом браузере. Войди в аккаунт, чтобы оно было на всех устройствах.</p>'}`;
  const g=$('grid');if(!S.fav.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">Здесь пока пусто. Нажимай ♡ на товарах, которые понравились.<br><br><a class="btn pri" href="#/">К товарам</a></div>';return}
  try{const r=await api('/api/shop/products?ids='+S.fav.join(','));S.colMap=S.colMap||{};(r.colors||[]).forEach(c=>S.colMap[c.id]=c);
    const ord=new Map(S.fav.map((id,i)=>[id,i]));drawGrid(g,r.items.sort((a,b)=>ord.get(a.id)-ord.get(b.id)))}catch(e){g.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function updCart(){const n=S.cart.reduce((a,l)=>a+l.qty,0);$('cartN').textContent=n||'';$('cartN2').textContent=n||'';
  const L=$('cartList');if(!S.cart.length){L.innerHTML='<div class="empty" style="margin-top:16px">Корзина пуста</div>'}
  else L.innerHTML=S.cart.map((l,i)=>`<div class="cl"><img src="${esc(l.thumb)}" alt=""><div style="flex:1;min-width:0"><div class="t">${esc(l.title)}</div>
    ${l.colorName?`<div class="n">${l.pending?'🌈':'🎨'} ${esc(l.colorName)}</div>`:''}${l.pending?'<div class="n" style="color:#b45309">цену подтвердит мастер</div>':''}${l.note?`<div class="n">${esc(l.note)}</div>`:''}<div style="display:flex;align-items:center;gap:10px;margin-top:6px">
    <div class="qty"><button data-q="${i}" data-d="-1">−</button><input value="${l.qty}" data-qi="${i}" inputmode="numeric"><button data-q="${i}" data-d="1">+</button></div>
    <b>${l.pending?'≈ ':''}${rub(l.price*l.qty)}</b><button class="btn sm ghost" data-rm="${i}" title="Убрать">🗑</button></div></div></div>`).join('');
  $('cartTot').textContent=rub(S.cart.reduce((a,l)=>a+l.price*l.qty,0));$('toCheckout').disabled=!S.cart.length}
$('cartList').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.rm!=null){S.cart.splice(+b.dataset.rm,1);saveCart()}
  if(b.dataset.q!=null){const l=S.cart[+b.dataset.q];l.qty=Math.max(1,Math.min(999,l.qty+ +b.dataset.d));saveCart()}};
$('cartList').onchange=e=>{const i=e.target.dataset.qi;if(i!=null){S.cart[+i].qty=Math.max(1,Math.min(999,parseInt(e.target.value)||1));saveCart()}};
const ckey=c=>c?(c.ids?'m'+c.ids.join(','):String(c.id||0)):'0',lkey=l=>l.colors&&l.colors.length?'m'+l.colors.join(','):String(l.color||0);
const lineOf=(id,c,note)=>S.cart.find(l=>l.id===id&&lkey(l)===ckey(c)&&(note==null||(l.note||'')===note));
const lastLine=id=>{for(let i=S.cart.length-1;i>=0;i--)if(S.cart[i].id===id)return S.cart[i];return null};
function stepLine(l,d){l.qty=Math.min(999,l.qty+d);if(l.qty<1)S.cart.splice(S.cart.indexOf(l),1);saveCart()}
const CARTSVG='<svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.1 10.2a1.6 1.6 0 0 0 1.6 1.3h8.3a1.6 1.6 0 0 0 1.5-1.2L20.5 8H6.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.6" fill="currentColor"/><circle cx="17" cy="19.5" r="1.6" fill="currentColor"/></svg>';
const stepHtml=(l,big)=>`<div class="stp ${big?'pstp':''}"><div class="qty"><button data-dec="1" aria-label="Меньше">−</button><b>${l.qty}</b><button data-inc="1" aria-label="Больше">+</button></div><button class="go" data-tocart="1" title="Открыть корзину" aria-label="Открыть корзину">${CARTSVG}${big?' В корзине':''}</button></div>`;

  terms:`<h2>Условия заказа, оплаты, доставки и возврата</h2>
    <h3>Как заключается договор</h3><p>Описания, фотографии и цены на сайте носят информационный характер и не являются публичной офертой (п. 2 ст. 437 ГК РФ). Оформленный на сайте заказ или заявка на печать — это предложение покупателя. Продавец связывается с покупателем, подтверждает наличие, цену, срок изготовления и стоимость доставки. Договор считается заключённым с момента такого подтверждения. Продавец вправе отказаться от заказа до подтверждения, например если изделие невозможно напечатать.</p>
    <h3>Изготовление</h3><p>Большинство изделий печатается после заказа. Обычный срок изготовления: ${esc(i.make_days||'3–7 дней')}, точный срок сообщаем при подтверждении. Изделия напечатаны на 3D-принтере, поэтому видимые слои, небольшие отличия оттенка и фактуры от фотографий являются особенностью технологии, а не браком.</p>
    <h3>Оплата</h3>${i.pay_text?P(i.pay_text):`<p>Оплата производится при получении заказа, после того как продавец подтвердит заказ и срок изготовления. Онлайн-оплата на сайте пока недоступна. ${i.seller_status&&/самозанят|НПД/i.test(i.seller_status)?'':'Покупателю выдаётся кассовый чек.'}</p>`}
    <h3>Доставка и получение</h3>${i.delivery_text?P(i.delivery_text):`<p>Доступные способы получения: ${esc(delNames||'самовывоз')}. Стоимость доставки рассчитывается по тарифам службы доставки и сообщается при подтверждении заказа. Риск случайной гибели товара переходит к покупателю с момента передачи изделия покупателю или службе доставки.</p>`}
    <h3>Возврат и обмен</h3>${i.returns_text?P(i.returns_text):`<p><b>Изделия из каталога</b> надлежащего качества можно вернуть в течение 7 дней после получения, если сохранены их товарный вид и потребительские свойства (п. 4 ст. 26.1 Закона «О защите прав потребителей»). Деньги возвращаются в течение 10 дней с момента получения требования, за вычетом расходов продавца на доставку возвращённого товара.</p>
      <p><b>Изделия, изготовленные по индивидуальному заказу</b> (по идее, рисунку или модели покупателя, а также с персональными изменениями размера, надписи или формы), имеют индивидуально-определённые свойства. Если они надлежащего качества, вернуть их нельзя.</p>
      <p><b>Если изделие с браком</b>, напишите нам и приложите фото: переделаем изделие, уменьшим цену или вернём деньги.</p>`}
    <h3>Безопасность</h3><p>${esc(i.age_note||'')}</p>
    <h3>Файлы покупателя</h3><p>Присылая изображения и модели, покупатель подтверждает, что имеет право на их использование. Продавец не печатает оружие и его основные части, запрещённые к обороту предметы, а также копии чужих товарных знаков и персонажей без разрешения правообладателя.</p>
    <p class="mut">Продавец: ${sel}. Связь: ${mail}.</p>`,
  privacy:`<h2>Политика конфиденциальности</h2><p class="mut">Редакция от ${esc(i.policy_date||'')}</p>
    <h3>1. Кто обрабатывает данные</h3><p>Оператор персональных данных: ${sel}${i.city?', '+esc(i.city):''} (далее — оператор). Связь с оператором: ${mail}.</p>
    <h3>2. Какие данные мы получаем</h3><ul><li>имя или как к вам обращаться, телефон, электронная почта;</li><li>адрес доставки, комментарии к заказу, описание заявки и файлы, которые вы присылаете;</li><li>для личного кабинета: логин и зашифрованный пароль, либо данные профиля соцсети, через которую вы вошли; контакты и адрес, если вы сохранили их в кабинете (изменить или удалить их, как и сам аккаунт, можно в разделе «Личный кабинет»);</li><li>отзывы: имя, оценка, текст и фото, которые вы публикуете с вашего согласия;</li><li>технические данные: IP-адрес, время запроса, cookie для входа в кабинет.</li></ul>
    <h3>3. Зачем</h3><ul><li>принять, подтвердить, изготовить и передать заказ;</li><li>связаться с вами по заказу или заявке;</li><li>передать заказ службе доставки, если вы выбрали доставку;</li><li>выполнить требования закона (налоги, чеки, бухгалтерский учёт);</li><li>защитить сайт от злоупотреблений.</li></ul><p>Мы не продаём данные, не передаём их для рекламы и не делаем рассылок без вашего отдельного согласия.</p>
    <h3>4. Основания</h3><p>Ваше согласие (п. 1 ч. 1 ст. 6 Федерального закона № 152-ФЗ «О персональных данных») и исполнение договора, стороной которого вы являетесь (п. 5 ч. 1 ст. 6).</p>
    <h3>5. Что мы делаем с данными</h3><p>Сбор, запись, систематизация, хранение, уточнение, использование, передача службе доставки (только имя, телефон и адрес для доставки), обезличивание, блокирование, удаление и уничтожение. Обработка ведётся с использованием средств автоматизации. Данные хранятся на сервере, расположенном на территории Российской Федерации.</p>
    <h3>6. Сколько храним</h3><p>Пока это нужно для выполнения заказа и не дольше 3 лет после его завершения, если более долгий срок не требуется по закону (например, для налогового учёта). При отзыве согласия данные удаляются в течение 30 дней, кроме тех, которые мы обязаны хранить по закону.</p>
    <h3>7. Ваши права</h3><p>Вы можете узнать, какие данные о вас хранятся, потребовать их уточнить или удалить, а также отозвать согласие. Для этого напишите оператору: ${mail}. Мы ответим в течение 10 рабочих дней. Вы также вправе обратиться в Роскомнадзор или в суд.</p>
    <h3>8. Cookie и данные в браузере</h3><p>Сайт использует только технически необходимые cookie (вход в личный кабинет). Контакты для повторного заказа и список избранного хранятся в вашем браузере. Содержимое корзины (какие товары и сколько) также сохраняется на нашем сервере под случайным номером без имени и контактов, чтобы мы видели интерес к товарам; если вы вошли в аккаунт, корзина и избранное связаны с ним. Сторонних счётчиков и рекламных систем на сайте нет.</p>
    <h3>9. Защита</h3><p>Соединение с сайтом защищено шифрованием (HTTPS), пароли хранятся только в виде хеша, доступ к заказам есть только у оператора.</p>`,
  consent:`<h2>Согласие на обработку персональных данных</h2>
    <p>Отмечая галочку «Даю согласие на обработку моих персональных данных» при оформлении заказа или заявки на сайте, я свободно, своей волей и в своём интересе даю согласие оператору — ${sel} — на обработку моих персональных данных: имени, номера телефона, адреса электронной почты, адреса доставки, текста комментариев и заявок, присланных мной файлов, IP-адреса.</p>
    <p><b>Цели обработки:</b> оформление, подтверждение, изготовление и доставка заказа, связь со мной по заказу или заявке, выполнение требований законодательства.</p>

// simple markup for the pages edited by the admin: "## " subheading, "- " list item, **bold**, blank line = new paragraph
function mdText(t){const out=[];let ul=null,par=[];const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const flush=()=>{if(par.length){out.push('<p>'+par.map(inl).join('<br>')+'</p>');par=[]}};
  for(const raw of String(t||'').split('\n')){const l=raw.trim();
    if(/^##\s+/.test(l)){flush();ul=null;out.push('<h3>'+inl(l.replace(/^##\s+/,''))+'</h3>')}
    else if(/^[-•]\s+/.test(l)){flush();if(!ul){ul=[];out.push(ul)}ul.push(inl(l.replace(/^[-•]\s+/,'')))}
    else if(!l){flush();ul=null}else{ul=null;par.push(l)}}
  flush();return out.map(x=>Array.isArray(x)?'<ul>'+x.map(i=>'<li>'+i+'</li>').join('')+'</ul>':x).join('')}
function htmlToMd(root){const out=[];const txt=n=>{let s='';n.childNodes.forEach(c=>{if(c.nodeType===3)s+=c.textContent;else if(c.tagName==='B'||c.tagName==='STRONG')s+='**'+c.textContent+'**';else if(c.tagName==='BR')s+='\n';else s+=txt(c)});return s};
  root.childNodes.forEach(n=>{if(n.nodeType!==1){const t=n.textContent.trim();if(t)out.push(t);return}
    if(n.tagName==='H3')out.push('## '+txt(n).trim());else if(n.tagName==='UL')out.push([...n.querySelectorAll('li')].map(li=>'- '+txt(li).trim()).join('\n'));else out.push(txt(n).trim().replace(/[ \t]+/g,' '))});
  return out.filter(Boolean).join('\n\n')}
