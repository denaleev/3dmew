<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Мяу-аркада — 3DМяу</title>
<meta name="description" content="Мини-игры с котиком 3DМяу для детей и подростков: без рекламы и покупок, с турнирной таблицей.">
<link rel="icon" type="image/png" href="/api/shop/favicon/64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b0a3d;--mag:#ff2e88;--pk:#ff7ac6;--or:#ff9f1c;--yl:#ffd23f;--cy:#22e0d0;--lav:#f6e2ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Rubik,Nunito,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 8%,#ff5fb0 0,transparent 35%),radial-gradient(circle at 88% 18%,#ffb23f 0,transparent 30%),radial-gradient(circle at 50% 105%,#22e0d0 0,transparent 40%),linear-gradient(160deg,#7a1fd1,#3d0a72);min-height:100%}
html{background:#3d0a72}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(#ffffff22 2px,transparent 2.5px);background-size:26px 26px;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
.pill{background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:99px;padding:5px 13px;font-weight:900;font-size:17px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sq{width:46px;height:46px;flex:none;border-radius:15px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;font-size:20px;font-weight:900;text-decoration:none;color:var(--ink)}
.sq:active,.play:active,.ctl button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.play{background:linear-gradient(180deg,#ff6fb5,#ff2e88);color:#fff;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:99px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;text-shadow:0 2px 0 var(--ink);font-size:22px;padding:10px 22px}
.title{font-weight:900;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:.5px}
.chip{border:3px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:800;font-size:15px;background:#fff}
.chip.on{background:var(--yl)}
/* витрина */
.hub{position:relative;max-width:1280px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(34px,6vw,64px);line-height:1;flex:1;min-width:260px}
.top h1 b{color:var(--yl)}
.opts{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.diff{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.diff span{color:#fff;font-weight:900;text-shadow:0 2px 0 var(--ink)}
.daily{font-size:15px;background:var(--yl);white-space:normal}
.daily.done{background:#9dff4a}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin-top:24px}
.card{background:linear-gradient(180deg,#f9e6ff,#e6c4ff);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:28px;padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-decoration:none;color:var(--ink)}
.card:hover{transform:translateY(-3px)}
.nm{position:relative;margin:6px auto 0;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:16px;padding:4px 14px;font-weight:900;font-size:20px;text-align:center}
.nm:before,.nm:after{content:"";position:absolute;top:-14px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:14px solid var(--ink)}
.nm:before{left:12px}.nm:after{right:12px}
.pv{border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#2b0a3d;aspect-ratio:3/4}
.pv svg{display:block;width:100%;height:100%}
.meta{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.meta .chip{font-size:13px}
.foot{color:#fff;text-align:center;font-weight:800;font-size:14px;text-shadow:0 2px 0 var(--ink);margin-top:26px;line-height:1.6}
.foot a{color:#fff}
/* турнирная таблица слева от игр: всегда на виду */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start;margin-top:24px}
.layout .cards{margin-top:0;grid-template-columns:repeat(4,1fr)}
.side{position:sticky;top:12px;background:#fff;border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 24px);overflow:auto}
.side h3{margin:0;font-size:22px;font-weight:900;display:flex;align-items:center;gap:6px}
.side select{font:inherit;font-weight:800;font-size:15px;border:3px solid var(--ink);border-radius:14px;padding:6px 8px;background:var(--lav);width:100%}
.side .sm{display:flex;gap:5px;flex-wrap:wrap}.side .sm .chip{font-size:13px;padding:3px 9px}
.side .lbr{padding:4px 8px;border-width:2px;font-size:14px}.side .lbr .pl{width:26px}
.side .who{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;opacity:.9}
.side .who button{margin-left:auto;border:2px solid var(--ink);border-radius:10px;background:var(--yl);font-weight:900;font-size:12px;padding:3px 8px;white-space:nowrap}
.side .empty{font-size:14px;opacity:.75;text-align:center;padding:8px 0}
@media(max-width:1180px){.cards{grid-template-columns:repeat(4,1fr)}.layout .cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.cards,.layout .cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.cards,.layout .cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.opts{align-items:stretch;width:100%}.diff{justify-content:center}.cards{gap:12px}.card{padding:8px;border-radius:22px;gap:6px}.nm{font-size:15px;padding:3px 8px}.nm:before,.nm:after{display:none}.meta{display:none}.play{font-size:17px;padding:7px 12px}}
/* экран игры */
.game{position:fixed;inset:0;display:flex;flex-direction:column;z-index:5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px}
.hud .gt{flex:1;text-align:center;font-size:clamp(18px,3vw,30px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .pill{font-size:15px;padding:4px 10px}
.stage{flex:1;position:relative;min-height:0;margin:0 10px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:22px}
.ctl{display:flex;justify-content:center;gap:8px;padding:10px 8px 12px;flex-wrap:nowrap}
.ctl button{width:64px;height:58px;border-radius:18px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:24px;font-weight:900;touch-action:none;user-select:none;-webkit-user-select:none}
.ctl button.wide{width:auto;padding:0 12px;font-size:16px}
.keys{color:#fff;text-align:center;font-weight:800;font-size:14px;text-shadow:0 2px 0 var(--ink);padding:6px 10px 12px}
@media(max-width:520px){.hud .gt{display:none}.hud{justify-content:space-between}.box{padding:14px;gap:8px}.box h2{font-size:24px}.box .cat{width:64px;height:64px}.box p{font-size:14px}.box .big{font-size:34px}.play{font-size:19px}}
@media(hover:hover) and (pointer:fine){.ctl.touch{display:none}}
@media(hover:none),(pointer:coarse){.keys{display:none}}
.panel{position:absolute;inset:0;display:grid;place-items:center;background:#2b0a3d99;border-radius:22px;padding:14px;z-index:3}
.box{background:linear-gradient(180deg,#f9e6ff,#e6c4ff);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);border-radius:26px;padding:20px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-height:100%;overflow:auto}
.box h2{font-size:30px}
.box p{font-weight:700;font-size:15px;line-height:1.45}
.box .modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.box .big{font-size:44px;font-weight:900}
.box .cat{width:96px;height:96px}
.box .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.box .play.alt{background:#fff;color:var(--ink);text-shadow:none}
/* турнир */
.lbov{position:fixed;inset:0;z-index:15;background:#2b0a3dcc;display:grid;place-items:center;padding:12px}
.lbov .box{max-width:520px;max-height:calc(100vh - 24px)}
.lbtop{display:flex;gap:8px;align-items:center;width:100%}.lbtop h2{flex:1}
.lbnick{display:flex;gap:6px;width:100%}.lbnick input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:16px;border:3px solid var(--ink);border-radius:14px;padding:6px 10px}
.lbnick button{border:3px solid var(--ink);border-radius:14px;background:var(--yl);font-weight:900;padding:0 12px;box-shadow:0 3px 0 var(--ink)}
.lbl{width:100%;display:flex;flex-direction:column;gap:5px}
.lbr{display:flex;gap:8px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 10px;font-weight:800;text-align:left}
.lbr.me{background:var(--yl)}.lbr .pl{width:32px;font-weight:900}.lbr .nk{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr .sc{font-weight:900}
.lbr .x{border:0;background:none;font-size:15px;padding:0 2px}
.lbnote{font-size:13px!important;opacity:.85}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:20;background:var(--yl);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:18px;padding:8px 16px;font-weight:900;text-align:center;max-width:90vw}
</style>
</head>
<body>
<div class="hub" id="hub">
  <div class="top">
    <a class="sq" href="/" title="В магазин" aria-label="В магазин">⌂</a>
    <h1 class="title"><b>3D</b> МЯУ-АРКАДА</h1>
    <div class="opts">
      <div class="diff" id="diff"><span>Сложность:</span>
        <button class="chip" data-d="kid">🐣 Малыш</button><button class="chip" data-d="player">🎮 Игрок</button><button class="chip" data-d="pro">🔥 Профи</button>
        <button class="sq" id="mute" title="Звук" aria-label="Звук" style="width:40px;height:40px;font-size:18px">🔊</button>
      </div>
      <div class="pill daily" id="daily"></div>
    </div>
  </div>
  <div class="layout"><aside class="side" id="side" aria-label="Турнирная таблица"></aside><div class="cards" id="cards"></div></div>
  <div class="foot">Без рекламы и покупок · Рекорды сохраняются на сервере<span id="acct"></span> · В турнирной таблице видно только ник, который ты придумаешь сам · Через 20 минут игры котик предложит передышку<br><a href="/">← Вернуться в магазин 3DМяу</a></div>
</div>

<div class="lbov hide" id="lb"><div class="box" id="lbBox"></div></div>

<div class="game hide" id="game">
  <div class="hud">
    <button class="sq" id="gBack" aria-label="Все игры">⌂</button>
    <button class="sq" id="gPause" aria-label="Пауза">⏸</button>
    <div class="gt title" id="gTitle"></div>
    <span class="pill" id="gL"></span><span class="pill" id="gR"></span>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas>
    <div class="panel hide" id="panel"><div class="box" id="box"></div></div>
  </div>
  <div class="ctl" id="ctl"></div>
  <div class="keys" id="keys"></div>
</div>

<script src="/games/core.js"></script>
<script src="/games/previews.js"></script>
<script src="/games/blocks.js"></script>
<script src="/games/snake.js"></script>
<script src="/games/run.js"></script>
<script src="/games/bridge.js"></script>
<script src="/games/fly.js"></script>
<script src="/games/stack.js"></script>
<script src="/games/sort.js"></script>
<script src="/games/mem.js"></script>
<script src="/games/rhythm.js"></script>
<script src="/games/pixel.js"></script>
<script>
'use strict';
(() => {
const $ = id => document.getElementById(id);
const ORDER = ['blocks', 'snake', 'run', 'bridge', 'fly', 'stack', 'sort', 'mem', 'rhythm', 'pixel'];
const BREAK_MS = 20 * 60 * 1000;
const DAILY = [
  {game: 'blocks', metric: 'lines', target: 30, text: 'Убери 30 линий в Мяу-блоках'},
  {game: 'snake', metric: 'length', target: 25, text: 'Вырасти змейку до длины 25'},
  {game: 'run', metric: 'meters', target: 1500, text: 'Пробеги 1 500 м в Мяу-ране'},
  {game: 'bridge', metric: 'stars', target: 6, text: 'Собери 6 звёзд в Мур-мосте'},
  {game: 'fly', metric: 'score', target: 15, text: 'Набери 15 очков в Летучем принтере'},
  {game: 'stack', metric: 'layers', target: 20, text: 'Напечатай башню из 20 слоёв'},
  {game: 'sort', metric: 'level', target: 3, text: 'Пройди 3-й уровень в Шариках'},
  {game: 'mem', metric: 'pairs', target: 10, text: 'Найди 10 пар в Мяу-памяти (4×5)'},
  {game: 'rhythm', metric: 'combo', target: 30, text: 'Сделай серию из 30 нот в Мяу-ритме'},
  {game: 'pixel', metric: 'pictures', target: 1, text: 'Раскрась одну картинку в Пиксель-мяу'},
];
const daily = () => DAILY[Math.floor(Mya.rng(Mya.today())() * DAILY.length)];
const dailyDone = () => Mya.store.get('daily', '') === Mya.today();

function toast(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

// ---------- витрина ----------
function renderHub() {
  const d = Mya.difficulty();
  document.querySelectorAll('#diff .chip').forEach(b => b.classList.toggle('on', b.dataset.d === d));
  $('mute').textContent = Mya.muted() ? '🔇' : '🔊';
  const dl = daily();
  $('daily').textContent = (dailyDone() ? '✅ Испытание дня выполнено: ' : '⚡ Испытание дня: ') + dl.text;
  $('daily').classList.toggle('done', dailyDone());
  $('cards').innerHTML = ORDER.map(id => {
    const G = Mya.games[id];
    return `<a class="card" href="#${id}"><div class="nm">${G.title}</div><div class="pv">${Mya.previews[id]()}</div>
      <div class="meta"><span class="chip">🏆 ${G.recordText()}</span><span class="chip">${G.subText()}</span></div>
      <div class="play">▶ Играть</div></a>`;
  }).join('');
}
$('diff').addEventListener('click', e => {
  const b = e.target.closest('[data-d]'); if (b) { Mya.store.set('diff', b.dataset.d); renderHub(); }
});
$('mute').onclick = () => { Mya.store.set('mute', !Mya.muted()); renderHub(); };

// ---------- экран игры ----------
const cv = $('cv'), g = cv.getContext('2d');
let G = null, inst = null, state = 'idle', mode = null, last = 0, raf = 0, playMs = 0;
let W = 0, H = 0;

function resize() {
  const r = $('stage').getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (inst) { inst.resize(W, H); if (state !== 'play') inst.draw(g); }
}
window.addEventListener('resize', resize);

const api = {
  hud(l, r) { $('gL').textContent = l; $('gR').textContent = r; $('gL').classList.toggle('hide', !l); $('gR').classList.toggle('hide', !r); },
  beep: Mya.beep,
  get diff() { return Mya.difficulty(); },
  get mode() { return mode; },
  canvas: cv,
  get running() { return state === 'play'; },
  challenge(metric, value) {
    const dl = daily();
    if (dl.game === G.id && dl.metric === metric && value >= dl.target && !dailyDone()) {
      Mya.store.set('daily', Mya.today()); toast('⚡ Испытание дня выполнено! Котик гордится тобой 🧡');
    }
  },
  over(o) { state = 'over'; showOver(o); },
};

function openGame(id) {
  G = Mya.games[id]; if (!G) return;
  $('hub').classList.add('hide'); $('game').classList.remove('hide');
  $('gTitle').textContent = G.title.toUpperCase();
  $('ctl').className = 'ctl' + (G.touchOnly === false ? '' : ' touch');
  $('ctl').innerHTML = (G.controls || []).map(c => `<button class="${c.wide ? 'wide' : ''}" data-k="${c.k}" aria-label="${c.aria || c.l}">${c.l}</button>`).join('');
  $('ctl').classList.toggle('hide', !(G.controls || []).length);
  $('keys').textContent = G.keys || '';
  inst = G.create(api);
  mode = Mya.store.get('mode.' + id, G.modes[0].id);
  if (!G.modes.some(m => m.id === mode)) mode = G.modes[0].id;
  resize();
  showStart();
}
function closeGame() {
  if (inst && inst.destroy) inst.destroy();
  inst = null; G = null; state = 'idle'; cancelAnimationFrame(raf);
  $('game').classList.add('hide'); $('hub').classList.remove('hide'); $('panel').classList.add('hide');
  renderHub();
}

function panel(html) { $('box').innerHTML = html; $('panel').classList.remove('hide'); }
function showStart() {
  state = 'menu'; cancelAnimationFrame(raf);
  inst.preview ? inst.preview(mode) : inst.reset(mode); inst.draw(g);
  const rec = G.recordText(mode);
  panel(`<img class="cat" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(Mya.catSVG(96))}" alt="">
    <h2 class="title">${G.title.toUpperCase()}</h2>
    <div class="modes">${G.modes.map(m => `<button class="chip ${m.id === mode ? 'on' : ''}" data-m="${m.id}">${m.name}</button>`).join('')}</div>
    <p id="mDesc">${G.modes.find(m => m.id === mode).desc}</p>
    <button class="play" id="go">▶ Играть</button>
    <p>🏆 Рекорд: <b>${rec}</b></p>
    <p id="place" class="lbnote"></p><button class="chip" id="lbHere">🏅 Турнирная таблица</button>
    ${G.extra ? G.extra(mode) : ''}
    <p style="font-size:13px;opacity:.8">${G.hint}</p>`);
  $('box').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; Mya.store.set('mode.' + G.id, mode); showStart(); });
  $('go').onclick = start;
  $('lbHere').onclick = () => openBoard(G.id, boardMode(G.id, mode));
  showPlace(G.id, mode);
}
// место игрока в турнире под рекордом
async function showPlace(id, m) {
  const el = $('place'); if (!el || Mya.cloud.off) return;
  try {
    const t = await Mya.cloud.top(id, boardMode(id, m), 1); if ($('place') !== el) return;
    el.innerHTML = t.me ? `Место в турнире: <b>${t.me.place}</b>${t.total ? ' из ' + Math.max(t.total, t.me.place) : ''}${t.me.listed ? '' : ' · придумай ник, чтобы попасть в таблицу'}` : '';
  } catch (e) { /* без сети: просто не показываем */ }
}
function start() {
  $('panel').classList.add('hide'); inst.reset(mode); inst.start && inst.start(); state = 'play'; last = performance.now(); loop(last);
}
function pause() {
  if (state !== 'play') return; state = 'pause'; cancelAnimationFrame(raf);
  panel(`<h2 class="title">ПАУЗА</h2><div class="row"><button class="play" id="res">▶ Дальше</button><button class="play alt" id="rst">↺ Заново</button><button class="play alt" id="men">☰ Меню</button></div>`);
  $('res').onclick = resume; $('rst').onclick = start; $('men').onclick = showStart;
}
function resume() { $('panel').classList.add('hide'); state = 'play'; last = performance.now(); loop(last); }
function showOver(o) {
  cancelAnimationFrame(raf); inst.draw(g);
  const better = o.score != null && Mya.saveRecord(G.id, mode, o.score, o.lowerBetter);
  panel(`<img class="cat" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(Mya.catSVG(96))}" alt="">
    <h2 class="title">${o.title || 'ИГРА ОКОНЧЕНА'}</h2>
    ${o.big != null ? `<div class="big">${o.big}</div>` : ''}
    ${better ? '<div class="pill" style="background:#9dff4a">🏆 Новый рекорд!</div>' : ''}
    <p>${o.text || ''}</p><p id="place" class="lbnote"></p>
    <div class="row">${o.next ? '<button class="play" id="nxt">▶ Дальше</button>' : ''}<button class="play ${o.next ? 'alt' : ''}" id="again">↺ ${o.again || 'Ещё раз'}</button><button class="play alt" id="men">☰ Меню</button></div>`);
  $('again').onclick = start; $('men').onclick = showStart;
  SIDE.game = G.id; SIDE.mode = boardMode(G.id, mode); Mya.store.set('lb.game', SIDE.game, true); Mya.store.set('lb.mode', SIDE.mode, true);
  if (better) Mya.cloud.sync(false).then(() => showPlace(G.id, mode)); else showPlace(G.id, mode);
  if (o.next) $('nxt').onclick = () => { o.next(); start(); };
}
function breakTime() {
  state = 'pause'; cancelAnimationFrame(raf);
  panel(`<img class="cat" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(Mya.catSVG(96))}" alt="">
    <h2 class="title">МЯУ-ПЕРЕДЫШКА</h2><p>Ты играешь уже 20 минут. Котик предлагает потянуться, поморгать и попить водички 💧</p>
    <div class="row"><button class="play" id="res">▶ Ещё немного</button><button class="play alt" id="men">⌂ Ко всем играм</button></div>`);
  $('res').onclick = resume; $('men').onclick = () => { location.hash = ''; };
}

function loop(t) {
  if (state !== 'play') return;
  const dt = Math.min(50, t - last); last = t;
  playMs += dt;
  inst.update(dt / 1000);
  if (state === 'play') inst.draw(g);
  if (playMs >= BREAK_MS && state === 'play') { playMs = 0; breakTime(); return; }
  raf = requestAnimationFrame(loop);
}

$('gBack').onclick = () => { location.hash = ''; };
$('gPause').onclick = () => (state === 'play' ? pause() : state === 'pause' ? resume() : null);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

const ARROWS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '];
window.addEventListener('keydown', e => {
  if (!$('lb').classList.contains('hide')) { if (e.key === 'Escape') closeBoard(); return; }
  if (!inst) return;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'з') { state === 'play' ? pause() : state === 'pause' && resume(); return; }
  if (state === 'menu' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); start(); return; }
  if (ARROWS.includes(e.key)) e.preventDefault();
  if (state === 'play') inst.key(e.code, true, e.repeat);
});
window.addEventListener('keyup', e => { if (inst && state === 'play') inst.key(e.code, false); });

// экранные кнопки: удержание = повтор
const held = new Map();
$('ctl').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-k]'); if (!b || state !== 'play') return;
  e.preventDefault(); const k = b.dataset.k; inst.key(k, true, false);
  const c = (G.controls || []).find(x => x.k === k);
  if (c && c.repeat) held.set(e.pointerId, {k, t: setTimeout(function rep() { if (state === 'play') inst.key(k, true, true); held.get(e.pointerId).t = setTimeout(rep, 60); }, 170)});
  else held.set(e.pointerId, {k});
});
const release = e => { const h = held.get(e.pointerId); if (!h) return; clearTimeout(h.t); held.delete(e.pointerId); if (inst) inst.key(h.k, false); };
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => $('ctl').addEventListener(t, release));

// ---------- турнирная таблица ----------
const BOARD_MODES = {bridge: [{id: 'stars', name: 'Звёзды'}], pixel: [{id: 'all', name: 'Картины'}]};
const boardModes = id => BOARD_MODES[id] || Mya.games[id].modes;
const boardMode = (id, m) => (BOARD_MODES[id] ? BOARD_MODES[id][0].id : m);
const clock = ms => { const s = ms / 1000; return `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`; };
const num = v => Number(v).toLocaleString('ru-RU');
function fmtScore(id, m, v) {
  if ((id === 'blocks' && m === 'sprint') || id === 'mem') return clock(v);
  if (id === 'snake' && m === 'levels') return `Мир ${Math.floor((v - 1) / 4) + 1}-${(v - 1) % 4 + 1}`;
  return ({run: num(v) + ' м', stack: v + ' слоёв', sort: 'ур. ' + v, snake: 'длина ' + v, bridge: v + ' ⭐', pixel: v + ' 🖼'})[id] || num(v);
}
const LB = {game: 'blocks', mode: 'marathon'};
function openBoard(id, m) {
  LB.game = id || LB.game; LB.mode = m || boardModes(LB.game)[0].id;
  if (state === 'play') pause();
  $('lb').classList.remove('hide'); drawBoard();
}
function closeBoard() { const was = !$('lb').classList.contains('hide'); $('lb').classList.add('hide'); if (was && !G) drawSide(); }
async function drawBoard() {
  const me = Mya.cloud.info, box = $('lbBox');
  box.innerHTML = `<div class="lbtop"><h2 class="title">ТУРНИР</h2><button class="sq" id="lbX" aria-label="Закрыть">✕</button></div>
    <div class="lbnick"><input id="lbNick" maxlength="16" placeholder="Твой ник для таблицы" value="${esc(me.nick)}"><button id="lbSave">OK</button></div>
    <p class="lbnote">Придумай ник: не пиши настоящее имя и фамилию. Без ника твои рекорды сохраняются, но в таблице не видны.</p>
    <div class="modes">${ORDER.map(id => `<button class="chip ${id === LB.game ? 'on' : ''}" data-lg="${id}">${esc(Mya.games[id].title)}</button>`).join('')}</div>
    <div class="modes">${boardModes(LB.game).map(x => `<button class="chip ${x.id === LB.mode ? 'on' : ''}" data-lm="${x.id}">${esc(x.name)}</button>`).join('')}</div>
    <div class="lbl" id="lbList"><p>Загружаю…</p></div>
    <p class="lbnote">${me.signed_in ? `Ты вошёл как «${esc(me.name)}»: рекорды видны на всех твоих устройствах.` : 'Рекорды привязаны к этому браузеру. <a href="/#account">Войди в аккаунт магазина</a>, чтобы они были на всех устройствах.'}</p>`;
  $('lbX').onclick = closeBoard;
  $('lbSave').onclick = async () => { try { const n = await Mya.cloud.setNick($('lbNick').value); toast(n ? `Ник «${n}» сохранён` : 'Ник убран: тебя не видно в таблице'); drawBoard(); } catch (e) { toast(e.message); } };
  $('lbNick').onkeydown = e => { if (e.key === 'Enter') $('lbSave').click(); };
  box.querySelectorAll('[data-lg]').forEach(b => b.onclick = () => { LB.game = b.dataset.lg; LB.mode = boardModes(LB.game)[0].id; drawBoard(); });
  box.querySelectorAll('[data-lm]').forEach(b => b.onclick = () => { LB.mode = b.dataset.lm; drawBoard(); });
  let t; try { t = await Mya.cloud.top(LB.game, LB.mode, 20); } catch (e) { $('lbList').innerHTML = `<p>Не получилось загрузить таблицу: ${esc(e.message)}</p>`; return; }
  if (!$('lbList')) return;
  const medal = n => ['🥇', '🥈', '🥉'][n - 1] || n;
  $('lbList').innerHTML = (t.items.length ? t.items.map(r => `<div class="lbr ${r.me ? 'me' : ''}"><span class="pl">${medal(r.place)}</span><span class="nk">${esc(r.nick)}</span><span class="sc">${esc(fmtScore(t.game, t.mode, r.score))}</span>${r.pid ? `<button class="x" data-hide="${r.pid}" title="Убрать ник из таблицы">🚫</button>` : ''}</div>`).join('')
    : '<p>Пока никого нет. Стань первым!</p>')
    + (t.me && !t.items.some(r => r.me) ? `<div class="lbr me"><span class="pl">${t.me.place}</span><span class="nk">${t.me.listed ? esc(me.nick) : 'Ты (без ника)'}</span><span class="sc">${esc(fmtScore(t.game, t.mode, t.me.score))}</span></div>` : '');
  $('lbList').querySelectorAll('[data-hide]').forEach(b => b.onclick = async () => {
    if (!confirm('Убрать этот ник из таблицы? Игрок сможет придумать другой.')) return;
    try { await Mya.cloud.hide(b.dataset.hide); drawBoard(); } catch (e) { toast(e.message); }
  });
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// таблица слева от игр: выбранная игра запоминается, список обновляется сам
const SIDE = {game: Mya.store.get('lb.game', 'blocks'), mode: Mya.store.get('lb.mode', '')};
if (!Mya.games[SIDE.game]) SIDE.game = 'blocks';
let sideTimer = 0;
async function drawSide() {
  const el = $('side'); if (!el) return;
  if (Mya.cloud.off) { el.classList.add('hide'); return; }
  const modes = boardModes(SIDE.game);
  if (!modes.some(x => x.id === SIDE.mode)) SIDE.mode = modes[0].id;
  const me = Mya.cloud.info;
  el.innerHTML = `<h3>🏆 Турнир</h3>
    <select id="sideG" aria-label="Игра">${ORDER.map(id => `<option value="${id}" ${id === SIDE.game ? 'selected' : ''}>${esc(Mya.games[id].title)}</option>`).join('')}</select>
    ${modes.length > 1 ? `<div class="sm">${modes.map(x => `<button class="chip ${x.id === SIDE.mode ? 'on' : ''}" data-sm="${x.id}">${esc(x.name)}</button>`).join('')}</div>` : ''}
    <div class="lbl" id="sideL"><div class="empty">Загружаю…</div></div>
    <div class="who">${me.nick ? `Твой ник: <b>${esc(me.nick)}</b>` : 'Без ника тебя не видно в таблице'}<button id="sideNick">${me.nick ? '✏️ Ник' : '＋ Ник'}</button></div>`;
  $('sideG').onchange = () => { SIDE.game = $('sideG').value; SIDE.mode = ''; Mya.store.set('lb.game', SIDE.game, true); drawSide(); };
  el.querySelectorAll('[data-sm]').forEach(b => b.onclick = () => { SIDE.mode = b.dataset.sm; Mya.store.set('lb.mode', SIDE.mode, true); drawSide(); });
  $('sideNick').onclick = () => openBoard(SIDE.game, SIDE.mode);
  let t; try { t = await Mya.cloud.top(SIDE.game, SIDE.mode, matchMedia('(max-width:900px)').matches ? 5 : 10); } catch (e) { $('sideL').innerHTML = '<div class="empty">Таблица сейчас недоступна</div>'; return; }
  if (!$('sideL') || t.game !== SIDE.game || t.mode !== SIDE.mode) return;
  const medal = n => ['🥇', '🥈', '🥉'][n - 1] || n;
  $('sideL').innerHTML = (t.items.length ? t.items.map(r => `<div class="lbr ${r.me ? 'me' : ''}"><span class="pl">${medal(r.place)}</span><span class="nk">${esc(r.nick)}</span><span class="sc">${esc(fmtScore(t.game, t.mode, r.score))}</span></div>`).join('')
    : '<div class="empty">Пока никого нет. Стань первым!</div>')
    + (t.me && !t.items.some(r => r.me) ? `<div class="lbr me"><span class="pl">${t.me.place}</span><span class="nk">${t.me.listed ? esc(me.nick) : 'Ты'}</span><span class="sc">${esc(fmtScore(t.game, t.mode, t.me.score))}</span></div>` : '');
}
function sideLoop() { clearInterval(sideTimer); sideTimer = setInterval(() => { if (!G && !document.hidden) drawSide(); }, 60000); }
sideLoop();
$('lb').onclick = e => { if (e.target === $('lb')) closeBoard(); };
function showAcct(i) { $('acct').innerHTML = i.signed_in ? ` для «${esc(i.name)}» на всех устройствах` : ` (для всех устройств <a href="/#account">войди в аккаунт</a>)`; }
Mya.cloud.on(i => { showAcct(i); if (!G) { renderHub(); drawSide(); } });
Mya.cloud.sync(true);
window.addEventListener('pagehide', () => Mya.cloud.flush());
document.addEventListener('visibilitychange', () => { if (document.hidden) Mya.cloud.flush(); });

// ---------- навигация по #адресу ----------
function route() {
  const id = location.hash.slice(1);
  closeBoard();
  if (inst) closeGame();
  if (Mya.games[id]) openGame(id); else { renderHub(); drawSide(); }
}
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
