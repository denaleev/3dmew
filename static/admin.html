<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Управление магазином</title>
<link rel="icon" type="image/png" href="/api/shop/favicon/64.png"><link rel="apple-touch-icon" href="/api/shop/favicon/180.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8f1;--panel:#fff;--line:#f0e2d6;--text:#2d1a33;--muted:#7f6b7a;--acc:#7a2e8e;--acc2:#f07a1a;--soft:#f7ecfa;--ok:#15803d;--bad:#dc2626;--warn:#b45309;--grid:#f2e6dc}
*{box-sizing:border-box}html,body{margin:0}
body{font:14.5px/1.45 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hw{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
h1{font-size:17px;margin:0}
.sp{flex:1}
nav.tabs{max-width:1400px;margin:0 auto;display:flex;gap:4px;padding:0 16px;overflow-x:auto}
nav.tabs button{border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--acc);border-color:var(--acc)}
nav.tabs b.soft{background:#e9d5f0;color:var(--acc)}
nav.tabs b{background:#e8508a;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:4px}
nav.tabs b:empty{display:none}
main{max-width:1400px;margin:0 auto;padding:16px}
.btn{border:0;border-radius:11px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:#f7ece2;color:var(--text);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.96)}.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:linear-gradient(135deg,#f59331,#e2600c);color:#fff;box-shadow:0 3px 10px rgba(226,96,12,.22)}.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:#fee2e2;color:var(--bad)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{font:inherit;padding:8px 11px;border:1.5px solid var(--line);border-radius:11px;background:#fff}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#fff4ea}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--acc);white-space:nowrap}
.badge.new{background:#fef3c7;color:var(--warn)}.badge.cancelled,.badge.rejected{background:#fee2e2;color:var(--bad)}
.badge.done,.badge.ordered{background:#dcfce7;color:var(--ok)}.badge.printing,.badge.confirmed,.badge.reviewing,.badge.accepted{background:#fff0e0;color:#b94a06}.badge.ready,.badge.quoted{background:#e2f5ec;color:#256b4c}
.mut{color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:16px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.side{position:sticky;top:110px;max-height:calc(100vh - 126px);overflow:auto}
@media(max-width:1000px){.side{position:static;max-height:none}}
label.f{display:block;margin:0 0 10px}label.f>span{display:block;font-size:12.5px;font-weight:700;color:#5e4a5c;margin-bottom:4px}
label.f input,label.f textarea,label.f select{width:100%;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.hist{list-style:none;padding:0;margin:0}.hist li{padding:6px 0 6px 16px;border-left:2px solid var(--line);position:relative;font-size:13.5px}
.hist li::before{content:"";position:absolute;left:-5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.files{display:flex;flex-wrap:wrap;gap:8px}
.fl{width:110px;font-size:11.5px;text-align:center;word-break:break-all;color:inherit;text-decoration:none}
.fl .th{width:110px;height:110px;border-radius:10px;background:#f8efe6;display:grid;place-items:center;font-size:30px;overflow:hidden;margin-bottom:2px}
.fl .th img{width:100%;height:100%;object-fit:cover}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
@media(max-width:500px){.g2{grid-template-columns:1fr}}
.chart{position:relative}.chart svg{display:block;width:100%;height:210px;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:#2d1a33;color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;display:none;z-index:3;transform:translate(-50%,-110%)}
.hbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 64px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.hbar .tr{background:var(--grid);height:12px;border-radius:0 4px 4px 0}.hbar .fi{background:var(--acc);height:12px;border-radius:0 4px 4px 0}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:14px;background:var(--grid);border-radius:99px;overflow:hidden;margin:8px 0}.meter div{height:100%;background:var(--acc);border-radius:99px}
.meter.warn div{background:var(--warn)}.meter.bad div{background:var(--bad)}
.late{color:var(--bad);font-weight:700}
.empty{padding:30px;text-align:center;color:var(--muted)}
.gate{max-width:420px;margin:60px auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2d1a33;color:#fff;padding:10px 16px;border-radius:11px;z-index:90;display:none;font-weight:600}
.thumb{width:42px;height:56px;object-fit:cover;border-radius:8px;background:#f8efe6}
td input.inl{width:84px;font:inherit;padding:4px 6px;border:1.5px solid var(--line);border-radius:8px;text-align:right}
.hide{display:none!important}
.calcres{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.pf{font-size:13px;font-weight:600;text-decoration:none;display:inline-block;margin-top:3px}
.ipend{margin-top:6px;background:#faf5ff;border:1px solid #e9d5ff;border-radius:10px;padding:8px;color:#6d28d9;font-weight:600;font-size:13px}.ipend input{font:inherit;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px}.lnk{border:0;background:none;cursor:pointer;padding:0 2px}
.nl input,.nl select{font:inherit;font-size:14px;padding:7px 9px;border:1.5px solid var(--line);border-radius:10px;background:#fff;box-sizing:border-box}
</style>
</head>
<body>
<header><div class="hw"><img src="/img/logo-160.png" alt="" style="height:40px;width:auto"><h1 id="hName">Управление магазином</h1><div class="sp"></div>
  <a class="btn sm" href="/">🛍 Витрина</a><a class="btn sm" href="/builder">🎨 Конструктор карточек</a><span class="mut" id="who"></span></div>
  <nav class="tabs" id="tabs">
    <button data-t="orders" class="on">📦 Заказы<b id="bOrders"></b></button>
    <button data-t="queue">🖨 Очередь печати</button>
    <button data-t="requests">💡 Заявки<b id="bReq"></b></button>
    <button data-t="products">🏷 Товары</button>
    <button data-t="cats">🗂 Категории</button>
    <button data-t="colors">🎨 Цвета</button>
    <button data-t="carts">🛒 Корзины<b id="bCarts" class="soft"></b></button>
    <button data-t="reviews">⭐ Отзывы<b id="bRev"></b></button>
    <button data-t="feedback">✉️ Сообщения<b id="bFb"></b></button>
    <button data-t="stats">📊 Статистика</button>
    <button data-t="settings">⚙️ Настройки</button>
  </nav></header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub=x=>(Math.round((+x||0)*100)/100).toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽';
const num=x=>(+x||0).toLocaleString('ru-RU',{maximumFractionDigits:1});
const fdt=s=>s?new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const fd=s=>s?new Date(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'';
async function api(url,o){o=o||{};const opt={method:o.method||'GET',credentials:'same-origin',headers:{}};
  if(o.json!==undefined){opt.headers['content-type']='application/json';opt.body=JSON.stringify(o.json)}
  if(o.form!==undefined)opt.body=o.form;
  const r=await fetch(url,opt);if(!r.ok){let m='Ошибка '+r.status;try{const j=await r.json();if(j.detail)m=typeof j.detail==='string'?j.detail:(j.detail[0]&&j.detail[0].msg)||m}catch(e){}const er=new Error(m);er.status=r.status;throw er}
  return r.status===204?null:r.json()}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2400)}
const A={tab:'orders',oStatus:'open',oQ:'',oSel:null,rStatus:'open',rSel:null,days:30,labels:{},rlabels:{},settings:null};
const NEXT={new:['confirmed','cancelled'],confirmed:['printing','cancelled'],printing:['ready','cancelled'],ready:['shipped','done','cancelled'],shipped:['done'],done:[],cancelled:['new']};

/* ---------- gate ---------- */
async function boot(){let u=null;try{u=await api('/api/me')}catch(e){}
  if(!u||!u.id||!u.admin){$('tabs').classList.add('hide');$('main').innerHTML=`<div class="card gate"><h2>Вход для администратора</h2>
    ${u&&u.id?`<p class="mut">Аккаунт «${esc(u.name)}» не администратор. Как назначить администратора — в README (ADMIN_LOGINS).</p>`:''}
    <label class="f"><span>Имя или почта</span><input id="gN"></label><label class="f"><span>Пароль</span><input id="gP" type="password"></label>
    <div class="mut" id="gE" style="color:var(--bad);min-height:18px"></div><button class="btn pri" id="gGo">Войти</button></div>`;
    $('gP').onkeydown=e=>{if(e.key==='Enter')$('gGo').click()};
    $('gGo').onclick=async()=>{try{await api('/api/auth/login',{method:'POST',json:{login:$('gN').value,password:$('gP').value}});boot()}catch(e){$('gE').textContent=e.message}};return}
  $('tabs').classList.remove('hide');$('who').textContent='👤 '+u.name;
  try{const i=await api('/api/shop/info');A.labels=i.order_statuses;A.rlabels=i.request_statuses;$('hName').textContent=i.name+' · управление';
    if(i.favicon_v)document.querySelectorAll('link[rel=icon],link[rel=apple-touch-icon]').forEach(l=>l.href=l.href.split('?')[0]+'?v='+i.favicon_v)}catch(e){}
  const h=location.hash.slice(1);if(h)A.tab=h.split('/')[0];show(A.tab);badges()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1).split('/')[0];if(t&&t!==A.tab)show(t)});
function show(t){A.tab=t;history.replaceState(null,'','#'+t);document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ({orders,queue,requests,products,stats,settings,colors,feedback,cats,carts,reviews}[t]||orders)()}
async function badges(){try{const o=await api('/api/admin/orders?status=new&limit=1');$('bOrders').textContent=o.counts.new||'';
  const r=await api('/api/admin/requests?status=new');$('bReq').textContent=r.counts.new||'';
  const f=await api('/api/admin/feedback');$('bFb').textContent=f.items.filter(x=>!x.done).length||'';
  const rv=await api('/api/admin/reviews?status=pending');$('bRev').textContent=rv.counts.pending||'';
  const c=await api('/api/admin/carts?days=7');$('bCarts').textContent=c.items.length||''}catch(e){}}
setInterval(()=>{badges();if(A.tab==='orders'&&!A.oSel)loadOrders()},60000);

/* ---------- orders ---------- */
function orders(){$('main').innerHTML=`<div class="split"><div>
  <div class="bar" id="oChips"></div>
  <div class="bar"><input id="oQ" type="search" placeholder="№, имя, телефон, почта" value="${esc(A.oQ)}" style="flex:1;min-width:180px">
  <button class="btn sm pri" id="oNew" title="Заказ, который пришёл не через сайт: MAX, телефон, ярмарка">＋ Новый заказ</button><a class="btn sm" href="/api/admin/orders.csv">⬇️ Excel (CSV)</a></div>
  <div class="tw"><table class="t"><thead><tr><th>№</th><th>Когда</th><th>Покупатель</th><th>Что заказали</th><th class="n">Сумма</th><th class="n">Печать</th><th>Статус</th></tr></thead><tbody id="oList"></tbody></table></div>
  </div><div class="card side" id="oSide"><div class="empty">Выбери заказ слева</div></div></div>`;
  let t;$('oQ').oninput=()=>{clearTimeout(t);t=setTimeout(()=>{A.oQ=$('oQ').value;loadOrders()},250)};$('oNew').onclick=newOrder;loadOrders();if(A.oSel)openOrder(A.oSel)}
async function newOrder(){A.oSel=null;const box=$('oSide');box.innerHTML='<div class="empty">…</div>';box.scrollIntoView({behavior:'smooth',block:'start'});
  let ps,cols,info;try{[ps,cols,info]=await Promise.all([api('/api/admin/products'),api('/api/shop/colors'),api('/api/shop/info')])}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>';return}
  const pm=Object.fromEntries(ps.map(p=>[p.id,p])),src=['MAX','Telegram','Телефон','ВКонтакте','Ярмарка','Лично'];
  const colOpts=p=>{const cs=p&&p.colors&&p.colors.length?cols.filter(c=>p.colors.includes(c.id)):cols;const d=cs.find(c=>p&&p.default_color===c.id)||cs[0];return cs.length?cs.map(c=>`<option value="${c.id}" ${c===d?'selected':''}>🎨 ${esc(c.name)}</option>`).join('')+'<option value="0">без цвета</option>':''};
  const line=()=>`<div class="nl" style="border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px">
    <div style="display:flex;gap:6px"><select data-k="pid" style="flex:1;min-width:0"><option value="">— товар из магазина —</option>${ps.map(p=>`<option value="${p.id}">${esc(p.title)} · ${rub(p.price)}${p.stock?' · склад '+p.stock:''}</option>`).join('')}<option value="custom">✍️ Свой товар (нет в магазине)</option></select><button class="btn sm danger" data-k="rm" type="button">✕</button></div>
    <input data-k="title" class="hide" placeholder="Название, напр. Брелок с именем" maxlength="300" style="margin-top:6px;width:100%">
    <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><select data-k="color" class="hide" style="flex:1;min-width:120px"></select>
    <input data-k="qty" value="1" inputmode="numeric" style="width:64px" title="Количество"><input data-k="price" inputmode="decimal" placeholder="цена за шт." style="width:110px" title="Пусто = цена магазина (с учётом цвета)"></div>
    <input data-k="note" placeholder="Пожелание (необязательно)" maxlength="300" style="margin-top:6px;width:100%"></div>`;
  box.innerHTML=`<h2 style="margin:0 0 4px">＋ Новый заказ</h2><div class="mut" style="margin-bottom:10px">Для заказов не с сайта: из MAX, по телефону, на ярмарке. Он попадёт в общий список, очередь печати и статистику. Покупателю ничего не отправляется.</div>
    <label class="f"><span>Откуда пришёл</span><input id="nSrc" list="nSrcL" placeholder="MAX, телефон…" maxlength="60"><datalist id="nSrcL">${src.map(x=>`<option value="${x}">`).join('')}</datalist></label>
    <label class="f"><span>Имя покупателя *</span><input id="nName" maxlength="160"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="f" style="flex:1;min-width:140px"><span>Телефон</span><input id="nPhone" maxlength="60"></label><label class="f" style="flex:1;min-width:140px"><span>Почта</span><input id="nMail" maxlength="160"></label></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="f" style="flex:1;min-width:140px"><span>Получение</span><select id="nDel">${info.delivery.map(d=>`<option value="${esc(d.id)}">${esc(d.label)}</option>`).join('')}</select></label>
    <label class="f" style="flex:1;min-width:140px"><span>Статус</span><select id="nSt">${Object.entries(A.labels).map(([k,l])=>`<option value="${k}" ${k==='confirmed'?'selected':''}>${esc(l)}</option>`).join('')}</select></label></div>
    <label class="f"><span>Адрес</span><input id="nAddr" maxlength="1000"></label>
    <div style="font-weight:800;margin:4px 0 6px">Что заказали</div><div id="nLines">${line()}</div><button class="btn sm" id="nAdd" type="button">＋ Ещё позиция</button>
    <label class="f" style="margin-top:10px"><span>Комментарий</span><textarea id="nCom" rows="2" maxlength="3000"></textarea></label>
    <label style="display:block;margin-bottom:6px"><input type="checkbox" id="nPaid"> Уже оплачен</label>
    <label style="display:block;margin-bottom:10px"><input type="checkbox" id="nStock" checked> Списать со склада, что есть в наличии</label>
    <div style="display:flex;gap:8px"><button class="btn pri" id="nSave">💾 Создать заказ</button><button class="btn" id="nCancel">Отмена</button></div>`;
  const L=$('nLines');
  L.onchange=e=>{const el=e.target;if(el.dataset.k!=='pid')return;const r=el.closest('.nl'),p=pm[el.value],c=r.querySelector('[data-k=color]');
    r.querySelector('[data-k=title]').classList.toggle('hide',el.value!=='custom');c.innerHTML=colOpts(p);c.classList.toggle('hide',!p||!c.options.length);
    r.querySelector('[data-k=price]').placeholder=p?'цена: '+rub(p.price):'цена за шт.'};
  L.onclick=e=>{if(e.target.dataset.k==='rm'&&L.children.length>1)e.target.closest('.nl').remove()};
  $('nAdd').onclick=()=>L.insertAdjacentHTML('beforeend',line());$('nCancel').onclick=()=>{box.innerHTML='<div class="empty">Выбери заказ слева</div>'};
  $('nSave').onclick=async()=>{const items=[];for(const r of L.children){const g=k=>r.querySelector(`[data-k=${k}]`).value.trim(),pid=g('pid');if(!pid)continue;
      const pr=g('price').replace(',','.');items.push({product_id:pid==='custom'?null:+pid,title:g('title'),qty:Math.max(1,parseInt(g('qty'))||1),color:+(g('color')||0),price:pr?+pr:null,note:g('note')})}
    if(!$('nName').value.trim())return toast('Укажи имя покупателя');if(!items.length)return toast('Добавь хотя бы одну позицию');
    try{const r=await api('/api/admin/orders',{method:'POST',json:{name:$('nName').value,phone:$('nPhone').value,email:$('nMail').value,delivery:$('nDel').value,address:$('nAddr').value,
      comment:$('nCom').value,source:$('nSrc').value,status:$('nSt').value,paid:$('nPaid').checked,take_stock:$('nStock').checked,items}});
      toast('Заказ №'+r.id+' создан');await loadOrders();openOrder(r.id);badges()}catch(e){toast(e.message)}}}
async function loadOrders(){let r;try{r=await api(`/api/admin/orders?status=${A.oStatus}&q=${encodeURIComponent(A.oQ)}`)}catch(e){return}
  const c=r.counts,open=['new','confirmed','printing','ready','shipped'].reduce((a,s)=>a+(c[s]||0),0),all=Object.values(c).reduce((a,b)=>a+b,0);
  const ch=[['open','В работе',open],['','Все',all]].concat(Object.keys(r.labels).map(s=>[s,r.labels[s],c[s]||0]));

/* ---------- statistics ---------- */
function barChart(el,data,key,fmt,label){const W=Math.max(300,el.clientWidth||640),H=210,P={l:46,r:8,t:10,b:24},n=data.length,max=Math.max(1,...data.map(d=>d[key]));
  const step=niceStep(max),top=Math.ceil(max/step)*step,bw=(W-P.l-P.r)/n,y=v=>P.t+(H-P.t-P.b)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;
  for(let v=0;v<=top+1e-9;v+=step)s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;
  const every=Math.ceil(n/8);
  data.forEach((d,i)=>{const x=P.l+i*bw,h=H-P.b-y(d[key]),w=Math.max(1,bw-2);
    if(d[key]>0)s+=`<path d="M${x+1},${H-P.b}v${-Math.max(0,h-Math.min(4,w/2,h))}q0,${-Math.min(4,w/2,h)} ${Math.min(4,w/2)},${-Math.min(4,w/2,h)}h${w-2*Math.min(4,w/2)}q${Math.min(4,w/2)},0 ${Math.min(4,w/2)},${Math.min(4,w/2,h)}V${H-P.b}z" fill="var(--acc)"/>`;
    s+=`<rect class="hit" data-i="${i}" x="${x}" y="${P.t}" width="${bw}" height="${H-P.t-P.b}" fill="transparent"/>`;
    if(i%every===0)s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(d.lbl)}</text>`});
  el.innerHTML=s+`<line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="#dccbbf"/></svg><div class="tip"></div>`;
  const tip=el.querySelector('.tip');el.querySelectorAll('.hit').forEach(r=>{r.onmouseenter=r.onmousemove=e=>{const d=data[+r.dataset.i],b=el.getBoundingClientRect();
    tip.innerHTML=`<b>${esc(d.full||d.lbl)}</b><br>${esc(d.tip)}`;tip.style.display='block';tip.style.left=(e.clientX-b.left)+'px';tip.style.top=(e.clientY-b.top)+'px'};r.onmouseleave=()=>tip.style.display='none'})}
function niceStep(max){const raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),k=raw/p;return(k<=1?1:k<=2?2:k<=5?5:10)*p}
const short=v=>v>=1e6?num(v/1e6)+'М':v>=1e3?num(v/1e3)+'к':num(v);
function hbars(rows,val,fmt){const max=Math.max(1,...rows.map(val));return rows.map(r=>`<div class="hbar" title="${esc(r._tip||'')}"><div class="nm">${esc(r._name)}</div><div class="tr"><div class="fi" style="width:${val(r)/max*100}%"></div></div><div style="font-variant-numeric:tabular-nums;text-align:right">${fmt(r)}</div></div>`).join('')}

   <div class="card"><h2>Заказы по статусам (сейчас)</h2>${hbars(Object.keys(s.by_status).map(st=>({_name:s.labels[st],v:s.by_status[st]})),r=>r.v,r=>r.v)}</div>

async function cats(){$('main').innerHTML='<div class="empty">…</div>';let cs;try{cs=await api('/api/admin/categories')}catch(e){$('main').innerHTML='<div class="empty">'+esc(e.message)+'</div>';return}
  $('main').innerHTML=`<div class="card"><h2>🗂 Категории (группы товаров)</h2><div class="mut">Группы показываются на витрине подписями над каталогом, в этом порядке. Пустая группа (без товаров) на витрине не видна. Товар попадает в группу при редактировании (поле «Группа») или из конструктора (поле «Категория на витрине»). Если переименовать группу, все её товары перейдут в новое название. Если удалить, товары останутся, но без группы.</div></div>
    <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="cNew" maxlength="80" placeholder="Новая категория, напр. Новый год" style="flex:1;min-width:200px;font:inherit;padding:8px 11px;border:1.5px solid var(--line);border-radius:11px"><button class="btn pri" id="cAdd">＋ Добавить</button></div></div>
    <div class="tw"><table class="t"><thead><tr><th style="width:80px">Порядок</th><th>Название</th><th>Товаров</th><th>На витрине</th><th></th></tr></thead><tbody id="cList">
    ${cs.map((c,i)=>`<tr data-id="${c.id}"><td style="white-space:nowrap"><button class="btn sm" data-up="${i}" ${i?'':'disabled'} title="Выше">↑</button> <button class="btn sm" data-dn="${i}" ${i<cs.length-1?'':'disabled'} title="Ниже">↓</button></td>
      <td><input data-name value="${esc(c.name)}" maxlength="80" style="font:inherit;padding:6px 9px;border:1.5px solid var(--line);border-radius:9px;width:100%;min-width:140px"></td>
      <td class="mut">${c.count}</td><td><label><input type="checkbox" data-act ${c.active?'checked':''}> показывать</label></td>
      <td style="white-space:nowrap"><button class="btn sm" data-save>💾</button> <button class="btn sm danger" data-del title="Удалить">🗑</button></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Категорий пока нет</td></tr>'}</tbody></table></div>`;
  const add=async()=>{const n=$('cNew').value.trim();if(!n)return toast('Впиши название');try{await api('/api/admin/categories',{method:'POST',json:{name:n}});toast('Добавлено');cats()}catch(e){toast(e.message)}};
  $('cAdd').onclick=add;$('cNew').onkeydown=e=>{if(e.key==='Enter')add()};
  $('cList').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const tr=b.closest('tr'),id=+tr.dataset.id,c=cs.find(x=>x.id===id);
    try{if(b.dataset.up!=null||b.dataset.dn!=null){const ids=cs.map(x=>x.id),i=+(b.dataset.up!=null?b.dataset.up:b.dataset.dn),j=b.dataset.up!=null?i-1:i+1;[ids[i],ids[j]]=[ids[j],ids[i]];
        await api('/api/admin/categories/order',{method:'PUT',json:{ids}});return cats()}
      if(b.dataset.save!=null){const name=tr.querySelector('[data-name]').value.trim();if(!name)return toast('Нужно название');
        if(name!==c.name&&c.count&&!confirm(`Переименовать «${c.name}» в «${name}»? Товары группы (${c.count}) перейдут в новое название.`))return;
        await api('/api/admin/categories/'+id,{method:'PATCH',json:{name,active:tr.querySelector('[data-act]').checked}});toast('Сохранено');return cats()}
      if(b.dataset.del!=null){if(!confirm(`Удалить категорию «${c.name}»?`+(c.count?` ${c.count} товар(ов) останутся без группы.`:'')))return;
        await api('/api/admin/categories/'+id,{method:'DELETE'});toast('Удалено');cats()}}catch(er){toast(er.message)}};
  $('cList').onchange=async e=>{const a=e.target.closest('[data-act]');if(!a)return;const id=+a.closest('tr').dataset.id;
    try{await api('/api/admin/categories/'+id,{method:'PATCH',json:{active:a.checked}});toast(a.checked?'Группа видна на витрине':'Группа скрыта с витрины')}catch(er){toast(er.message)}}}

/* ---------- filament colours ---------- */
const swb=c=>c.thumb?`background-image:url('${esc(c.thumb)}')`:(c.hex2?`background:linear-gradient(135deg,${esc(c.hex)} 0 50%,${esc(c.hex2)} 50% 100%)`:`background:${esc(c.hex)}`);
async function colors(){$('main').innerHTML='<div class="empty">…</div>';let cs;try{cs=await api('/api/admin/colors')}catch(e){return}
  const MTYPES=[...new Set(['PLA','PLA Matte','Silk PLA','PETG','ABS','TPU'].concat(cs.map(c=>(c.material||'').trim()).filter(Boolean)))];
  const row=c=>`<div class="card col" data-id="${c?c.id:''}" style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px">
    <label style="cursor:pointer;text-align:center;font-size:12px;color:var(--muted)"><div class="cph" style="width:96px;height:96px;border-radius:14px;background-size:cover;background-position:center;${c?swb(c).replace(c.thumb||'§',c.photo||c.thumb||''):'background:#f3e8dc'}"></div>📷 фото пластика<input type="file" accept="image/*" data-k="photo" hidden></label>
    <div style="flex:1;min-width:240px"><div class="row"><label class="f"><span>Название цвета</span><input data-k="name" value="${esc(c?c.name:'')}" placeholder="напр. Silk розовый"></label>
      <label class="f"><span>Тип пластика</span><select data-k="mtype">${MTYPES.map(m=>`<option ${c&&c.material===m?'selected':''}>${esc(m)}</option>`).join('')}<option value="__own">＋ Свой тип…</option></select>
        <input data-k="material" class="hide" value="${esc(c?c.material:'')}" placeholder="напр. PLA+ или Wood PLA" style="margin-top:6px"></label></div>
      <div class="row"><label class="f"><span>Цвет</span><input type="color" data-k="hex" value="${esc(c?c.hex:'#e8508a')}" style="height:42px;padding:3px"></label>
      <label class="f"><span>Второй цвет (двухцветный, градиент)</span><div style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-k="two" ${c&&c.hex2?'checked':''} style="width:20px;height:20px;flex:none"><input type="color" data-k="hex2" value="${esc(c&&c.hex2?c.hex2:'#40c4d8')}" style="height:42px;padding:3px;flex:1;min-width:60px"></div></label>
      <label class="f"><span>Порядок</span><input data-k="sort" value="${c?c.sort:0}" inputmode="numeric" style="width:80px"></label></div>
      <label class="f"><span>Цена пластика, ₽ за кг <small class="mut">(по ней калькулятор считает цену товара, если этот цвет стандартный, и доплату за цвет)</small></span><input data-k="kg_price" inputmode="decimal" value="${c&&c.kg_price!=null?c.kg_price:''}" placeholder="например: 2400" style="max-width:220px"></label>
      <label class="f"><span>Примечание (видно покупателю)</span><input data-k="note" value="${esc(c?c.note:'')}" placeholder="напр. переливается на свету"></label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label><input type="checkbox" data-k="active" ${!c||c.active?'checked':''}> Доступен покупателям</label>
      <button class="btn sm pri" data-save>${c?'💾 Сохранить':'＋ Добавить цвет'}</button>${c?`<button class="btn sm danger" data-del>🗑</button><span class="mut">${c.used?'в '+c.used+' товар(ах)':'не используется'}</span>`:''}</div></div></div>`;
  $('main').innerHTML=`<div class="card"><h2>🎨 Палитра цветов</h2><div class="mut">Цвета пластика, из которых покупатель выбирает при заказе. Добавь фото катушки или образца: его видно в карточке товара, когда покупатель выбирает этот цвет. Какие цвета доступны для товара, отмечается в конструкторе (раздел «🛍 Витрина: цвета, фото и видео»).<br><br>💰 <b>Цена пластика</b>: если у цвета указана своя цена за кг, цена товара в этом цвете пересчитывается по весу изделия (с теми же наценкой, отходами и налогом, что в калькуляторе). Покупатель видит доплату или скидку рядом с каждым цветом.</div></div>
    <h3>Новый цвет</h3>${row(null)}<h3>Палитра (${cs.length})</h3>${cs.map(row).join('')||'<div class="empty">Пока пусто</div>'}`;
  document.querySelectorAll('.col').forEach(el=>{const id=el.dataset.id,g=k=>el.querySelector(`[data-k="${k}"]`);
    const mt=g('mtype'),own=()=>{g('material').classList.toggle('hide',mt.value!=='__own');if(mt.value!=='__own')g('material').value=mt.value};
    if(!el.dataset.id&&!g('material').value)g('material').value=mt.value;mt.onchange=()=>{own();if(mt.value==='__own'){g('material').value='';g('material').focus()}};own();
    g('photo').addEventListener('change',e=>{const f=e.target.files[0];if(f)el.querySelector('.cph').style.backgroundImage=`url('${URL.createObjectURL(f)}')`});
    el.querySelector('[data-save]').onclick=async()=>{const fd=new FormData();
      ['name','material','note','sort','kg_price'].forEach(k=>fd.append(k,g(k).value));fd.append('hex',g('hex').value);fd.append('hex2',g('two').checked?g('hex2').value:'');fd.append('active',g('active').checked?'1':'0');
      if(g('photo').files[0])fd.append('photo',g('photo').files[0]);
      if(!g('name').value.trim())return toast('Назови цвет');if(!g('material').value.trim())return toast('Укажи тип пластика');
      if(!(parseFloat(String(g('kg_price').value).replace(',','.'))>0))return toast('Укажи цену пластика за кг: по ней считается цена');
      try{await api(id?'/api/admin/colors/'+id:'/api/admin/colors',{method:id?'PATCH':'POST',form:fd});toast('Сохранено');colors()}catch(e){toast(e.message)}};
    const d=el.querySelector('[data-del]');if(d)d.onclick=async()=>{if(!confirm('Удалить цвет из палитры? Он пропадёт и из товаров.'))return;await api('/api/admin/colors/'+id,{method:'DELETE'});colors()}})}

/* ---------- feedback messages ---------- */
async function feedback(){$('main').innerHTML='<div class="empty">…</div>';let r;try{r=await api('/api/admin/feedback')}catch(e){return}
  $('main').innerHTML=`<div class="card"><h2>✉️ Обратная связь</h2><div class="mut">${r.mail_configured?`Каждое сообщение также уходит на почту <b>${esc(r.email)}</b>.`:`<b style="color:var(--bad)">Отправка на почту ${esc(r.email)} не настроена</b>: впиши SMTP_USER и SMTP_PASSWORD в .env (инструкция в README, раздел «Обратная связь»). Пока сообщения видны только здесь и в Telegram.`}</div></div>
   ${r.items.length?r.items.map(x=>`<div class="card" style="${x.done?'opacity:.6':''}"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b>№${x.id} · ${esc(x.name)}</b><span class="mut">${esc(x.contact)}</span><span class="mut">${fdt(x.created_at)}</span>${x.emailed?'<span class="mut">📧 отправлено</span>':''}
     <span style="flex:1"></span><label><input type="checkbox" data-fb="${x.id}" ${x.done?'checked':''}> Отвечено</label></div><p style="white-space:pre-line;margin:8px 0 0">${esc(x.text)}</p></div>`).join(''):'<div class="empty">Сообщений пока нет</div>'}`;
  document.querySelectorAll('[data-fb]').forEach(c=>c.onchange=async()=>{await api('/api/admin/feedback/'+c.dataset.fb,{method:'PATCH',json:{done:c.checked}});feedback();badges()})}

async function maxBox(){const box=$('maxBox');let m;try{m=await api('/api/admin/max/status')}catch(e){box.innerHTML='<h2>📣 Бот MAX</h2><div class="mut">'+esc(e.message)+'</div>';return}
  if(!m.configured){box.innerHTML=`<h2>📣 Бот MAX</h2><div class="mut">Бот не подключён. Создай бота через @MasterBot в MAX, впиши токен в <code>/opt/kartochki/.env</code> строкой <code>MAX_BOT_TOKEN=…</code> и выполни <code>systemctl restart kartochki</code>. Затем добавь бота в свою группу администратором.</div>`;return}
  box.innerHTML=`<h2>📣 Бот MAX ${m.bot?'· '+esc(m.bot):''}</h2>${m.error?`<div class="mut" style="color:var(--bad)">${esc(m.error)}</div>`:''}
    <div class="mut" style="margin-bottom:10px">Кнопка «📣 В MAX» в карточке товара на витрине отправляет фото, название, цену и ссылку в выбранную группу. Если группы нет в списке: добавь бота в группу, напиши там сообщение и обнови страницу.</div>
    <label class="f"><span>Группа для публикаций</span><select id="maxChat"><option value="">— не выбрана —</option>${(m.chats||[]).map(c=>`<option value="${c.chat_id}" ${String(c.chat_id)===String(m.chat_id)?'selected':''}>${esc(c.title)}</option>`).join('')}
      ${m.chat_id&&!(m.chats||[]).some(c=>String(c.chat_id)===String(m.chat_id))?`<option value="${m.chat_id}" selected>${esc(m.chat_title||m.chat_id)}</option>`:''}</select></label>
    <button class="btn" id="maxSave">💾 Сохранить группу</button>`;
  $('maxSave').onclick=async()=>{const sel=$('maxChat');if(!sel.value)return toast('Выбери группу');
    try{await api('/api/admin/max/chat',{method:'PUT',json:{chat_id:+sel.value,chat_title:sel.options[sel.selectedIndex].text}});toast('Группа сохранена')}catch(e){toast(e.message)}}}

const SF=[['name','Название магазина'],['tagline','Слоган на главной'],['meta_description','Описание для превью ссылки в Telegram, MAX, поиске (пусто = слоган)'],['phone','Телефон'],['email','Почта'],['telegram','Telegram (@ник)'],['max','MAX (ссылка на чат или ник, для контактов внизу сайта)'],['max_link','Ссылка для кнопки «Мы в MAX» на главной (https://…, пусто = кнопки нет)'],['address','Адрес самовывоза'],['min_order','Минимальная сумма заказа, ₽']];
const LF=[['seller_name','ФИО продавца (взрослого)'],['seller_status','Статус: самозанятый, ИП…'],['seller_inn','ИНН'],['seller_ogrnip','ОГРНИП (если ИП)'],['city','Город'],['make_days','Обычный срок изготовления'],
 ['pay_text','Оплата (пусто = стандартный текст)','ta'],['delivery_text','Доставка (пусто = стандартный текст)','ta'],['returns_text','Возврат (пусто = стандартный текст)','ta'],['age_note','Предупреждение под каждым товаром','ta'],['footer_text','Текст внизу сайта (footer)','ta'],['policy_date','Дата редакции политики']];
async function settings(){$('main').innerHTML='<div class="empty">…</div>';let s;try{s=A.settings=await api('/api/admin/settings')}catch(e){return}

   ${LF.map(([k,l,t])=>t==='ta'?`<label class="f"><span>${l}</span><textarea data-s="${k}" rows="3">${esc(s.shop[k]??'')}</textarea></label>`:`<label class="f"><span>${l}</span><input data-s="${k}" value="${esc(s.shop[k]??'')}"></label>`).join('')}</div>
  <div class="card"><h2>🧮 Расходы мастерской (для калькулятора)</h2>${CF.map(([k,l,t])=>t==='ta'?`<label class="f"><span>${l}</span><textarea data-c="${k}" rows="6">${esc(Object.entries(s.calc.materials).map(([n,p])=>n+' = '+p).join('\n'))}</textarea></label>`:`<label class="f"><span>${l}</span><input data-c="${k}" inputmode="decimal" value="${s.calc[k]}"></label>`).join('')}

   <button class="btn sm" id="calcDef" type="button">↺ Стандартные параметры</button>
   <div class="mut" style="margin-top:8px">Формула расчёта описана в README, раздел «Как считается цена».</div></div></div>
  <button class="btn pri" id="sSave">💾 Сохранить настройки</button>
  <div class="card" style="margin-top:16px"><h2>✈️ Уведомления в Telegram</h2><div class="mut" style="margin-bottom:10px">Бот пишет о новых заказах, заявках и сообщениях обратной связи. Токен и chat id задаются в файле .env на сервере (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID).</div><button class="btn" id="tgTest">📨 Отправить тестовое сообщение</button> <span id="tgRes" class="mut"></span></div>
  <div class="card" style="margin-top:16px"><h2>🖼 Значок сайта (favicon)</h2><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <img id="favImg" src="/api/shop/favicon/180.png?t=${Date.now()}" alt="" style="width:64px;height:64px;border-radius:12px;border:1px solid var(--line)">
    <div class="mut" style="flex:1;min-width:220px">Картинка во вкладке браузера и на экране телефона. Подойдёт любая: PNG, JPG, WEBP. Она обрежется до квадрата, лучше брать простую и контрастную.</div>
    <label class="btn">📷 Загрузить<input type="file" id="favFile" accept="image/*,.ico" hidden></label><button class="btn" id="favReset">↺ Логотип по умолчанию</button></div></div>
  <div class="card" style="margin-top:16px" id="maxBox"><h2>📣 Бот MAX</h2><div class="mut">Загружаю…</div></div>`;
  maxBox();
  $('favFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const fd=new FormData();fd.append('file',f,f.name);
    try{await api('/api/admin/favicon',{method:'PUT',form:fd});setFav();toast('Значок обновлён')}catch(er){toast(er.message)}});
  $('tgTest').onclick=async()=>{$('tgRes').textContent='⏳ Отправляю…';try{await api('/api/admin/telegram/test',{method:'POST'});$('tgRes').innerHTML='<b style="color:var(--ok)">✓ Отправлено, проверь Telegram</b>'}catch(e){$('tgRes').innerHTML='<b style="color:var(--bad)">'+esc(e.message)+'</b>'}};

  $('sSave').onclick=async()=>{const shop={},calc={nice_price:$('nice').checked,materials:s.calc.materials};  // plastic prices live in «Цвета»
    document.querySelectorAll('[data-s]').forEach(el=>shop[el.dataset.s]=el.value);shop.delivery=[...document.querySelectorAll('[data-dl]:checked')].map(el=>el.dataset.dl);
    document.querySelectorAll('[data-c]').forEach(el=>{const k=el.dataset.c;if(k==='materials'){const m={};el.value.split('\n').forEach(l=>{const[a,b]=l.split(/=|:/);if(a&&a.trim()&&b!=null)m[a.trim()]=+b.replace(',','.')||0});calc.materials=m}else calc[k]=el.value});
    try{A.settings=await api('/api/admin/settings',{method:'PUT',json:{shop,calc}});toast('Настройки сохранены');settings()}catch(e){toast(e.message)}}}
boot();
</script>
</body>
</html>
